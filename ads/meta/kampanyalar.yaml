# ============================================================
#  META (Instagram + Facebook) KAMPANYA YAPISI
#  {suslu_parantez} içindeki alanlar config/studio.yaml'dan doldurulur.
#  gerekli_stil: o stil studio.yaml'da false ise reklam otomatik atlanır.
#  sezon: sadece o dönemde aç (bkz. docs/06-icerik-takvimi.md)
#  Kontrol:  python3 tools/kontrol.py
# ============================================================

ortak:
  yerlesimler: ["instagram", "facebook"]
  instagram_yerlesimleri: ["stream", "story", "reels", "explore"]
  sabit_kurallar:
    - "Yaş alt sınırı 18 — Advantage+ kitlede de 'yaş alt sınırı' kontrolü 18'de kalmalı"
    - "Konum: stüdyonun etrafında yarıçap (studio.yaml > hedefleme.yaricap_km)"
    - "Konum seçeneği: 'Bu konumda yaşayan veya yakın zamanda bulunan kişiler'"
    - "Reklamlarda 'en iyi', 'bir numara', 'garantili', 'acısız' gibi kanıtlanamayan iddialar YOK"
    - "Görünüş hakkında olumsuz ifade YOK ('çirkin dövmenden utanıyor musun' gibi)"

kampanyalar:

  # ----------------------------------------------------------
  - kod: K1
    ad: "K1 | Keşif | Reels | ThruPlay"
    amac: OUTCOME_ENGAGEMENT
    optimizasyon: THRUPLAY
    hedef_yeri: ON_VIDEO
    butce_anahtari: meta_kesif_reels
    neden: >
      Yeni insanlara işini gösterir ve ucuza 'video izleyen' kitlesi biriktirir.
      K3 (yeniden hedefleme) bu havuzdan beslenir. Satış beklenmez.
    reklam_setleri:
      - kod: K1-A
        ad: "K1-A | 18+ | Yarıçap | Advantage+ kitle"
        kitle: genis
        reklamlar:
          - kod: K1-01
            format: reels
            kreatif: "Süreç videosu 15–25 sn: çizim → şablon → ilk çizgi → son hal. Müzik hızlı, son karede bitmiş dövme 2 sn durur."
            ekran_yazisi: "Bu dövme 3 saatte böyle oluştu"
            metin: |
              Fikirden tene: çizim, şablon, ilk çizgi ve son hal.
              Her tasarım sana özel çiziliyor — katalogdan kopya yok.
              📍 Bahçeşehir · {studyo_adi}
            baslik: "Sana özel tasarım dövme"
            cta: LEARN_MORE

          - kod: K1-02
            format: reels
            kreatif: "Aynı dövmenin taze hali ve 4–6 hafta sonraki iyileşmiş hali yan yana. Müşteri izniyle."
            ekran_yazisi: "Taze vs. 1 ay sonra"
            metin: |
              Dövmenin asıl sınavı iyileştikten sonra başlar.
              Çizgiler yerinde, gölgeler temiz. İyileşme takibini biz yapıyoruz.
              📍 Bahçeşehir · {studyo_adi}
            baslik: "İyileşmiş hali de güzel olsun"
            cta: LEARN_MORE

          - kod: K1-03
            format: reels
            kreatif: "{sanatci} kameraya konuşuyor (20–30 sn): kim olduğu, neyi sevdiği, stüdyodan kısa görüntü. Altyazı şart."
            ekran_yazisi: "Dövmeni kim yapacak?"
            metin: |
              Merhaba, ben {sanatci}. Bahçeşehir'de, sana özel tasarımlarla çalışıyorum.
              Dövmeden önce tanışalım: fikrini anlat, birlikte çizelim.
            baslik: "Sanatçıyla tanış"
            cta: LEARN_MORE

          - kod: K1-04
            format: reels
            sezon: "kasim-subat"
            kreatif: "Kısa bilgi videosu: güneş, deniz, havuz ikonu üstü çizili → 'kış = rahat iyileşme'. Son karede yeni bir iş."
            ekran_yazisi: "Dövme için ideal mevsim: KIŞ"
            metin: |
              Güneş yok, deniz yok, havuz yok — dövmen rahat iyileşir.
              Kışın yaptır, yaz geldiğinde tamamen oturmuş olsun. ☀️
              📍 Bahçeşehir · {studyo_adi}
            baslik: "Kış: dövmenin sezonu"
            cta: LEARN_MORE

  # ----------------------------------------------------------
  - kod: K2
    ad: "K2 | Mesaj | WhatsApp | Sohbet"
    amac: OUTCOME_ENGAGEMENT
    optimizasyon: CONVERSATIONS
    hedef_yeri: WHATSAPP          # IG DM tercih edersen: INSTAGRAM_DIRECT
    butce_anahtari: meta_mesaj
    neden: >
      Ana müşteri kaynağı. Reklama tıklayan kişi doğrudan WhatsApp'ta sana yazar.
      Karşılama mesajındaki kampanya kodu sayesinde hangi reklamdan geldiği belli olur.
    reklam_setleri:
      - kod: K2-A
        ad: "K2-A | 18+ | Yarıçap | Advantage+ kitle"
        kitle: genis
        reklamlar:
          - kod: K2-01
            format: carousel
            kreatif: "En iyi 6–8 işin, her kart tek dövme, kare/dikey. İlk kart en dikkat çekeni."
            metin: |
              Aklındaki dövmeyi bize yaz, birlikte tasarlayalım. ✍️
              ✔️ Sana özel çizim
              ✔️ Tek kullanımlık iğne, steril ortam
              ✔️ İyileşme takibi ve ücretsiz rötuş
              📍 Bahçeşehir · Randevulu çalışıyoruz
            baslik: "Fikrini yaz, birlikte çizelim"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Dövme fikrimi paylaşmak istiyorum."

          - kod: K2-02
            format: reels
            gerekli_stil: minimal_fine_line
            kreatif: "3–4 minimal dövme hızlı geçiş + ekranda fiyat yazısı. Son kare: 'Fiyat için yaz'."
            ekran_yazisi: "Minimal dövme {minimal_baslangic} TL'den"
            metin: |
              İlk dövmen mi? Küçük başla, doğru başla.
              Yazı, tarih, sembol, fine line… Yerini ve boyutunu birlikte seçelim,
              net fiyatı mesajda söyleyelim.
              Minimal dövmeler {minimal_baslangic} TL'den başlar; fiyat boyut ve detaya göre değişir.
            baslik: "Minimal dövme {minimal_baslangic} TL'den"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Minimal dövme için fiyat almak istiyorum."

          - kod: K2-03
            format: reels
            gerekli_stil: dovme_kapatma_cover_up
            kreatif: "Kapatma süreci: eski dövme (bulanık değil, net) → tasarım üzerine çizim → yeni hal. NOT: Meta öncesi/sonrası görselleri bazen işaretliyor; reddedilirse sadece 'yeni hali' kullan."
            ekran_yazisi: "Eski dövmen yeni bir hikâyeye dönüşebilir"
            metin: |
              Eski bir dövmen mi var? Üstüne yeni bir hikâye yazabiliriz.
              Fotoğrafını WhatsApp'tan gönder, neler yapılabileceğini ücretsiz değerlendirelim.
              📍 Bahçeşehir · {studyo_adi}
            baslik: "Kapatma için ücretsiz değerlendirme"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Eski dövmemi kapatmak istiyorum, fotoğraf göndereceğim."

          - kod: K2-04
            format: reels
            sezon: "etkinlik"
            kreatif: "Flash tasarımların olduğu sayfa + stüdyo hazırlığı. Tarih ve kontenjan ekranda net yazsın."
            ekran_yazisi: "FLASH GÜNÜ · Hazır tasarımlar sabit fiyatla"
            metin: |
              Flash Günü geliyor! ⚡
              Hazır tasarımlar sabit fiyatla, kontenjan sınırlı.
              Tarih ve tasarımlar için yaz, yerini ayıralım.
            baslik: "Flash Günü — yerini ayır"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Flash Günü için yer ayırtmak istiyorum."
            not: "Sadece GERÇEK bir flash etkinliği varken aç. Tarihi metne ekle."

          - kod: K2-05
            format: tekli_gorsel
            sezon: "aralik-subat"
            kreatif: "Şık bir hediye kartı tasarımı (fiziksel kart + zarf fotoğrafı)."
            metin: |
              Ona unutamayacağı bir hediye: {studyo_adi} hediye kartı. 🎁
              Tutarı sen seç, tasarımı birlikte yapalım.
              Yılbaşı ve Sevgililer Günü için WhatsApp'tan sipariş ver.
            baslik: "Hediye dövme kartı"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Hediye kartı almak istiyorum."

          - kod: K2-06
            format: reels
            sezon: "subat"
            kreatif: "Çift dövmeleri (eşleşen iki parça) — iki eli/kolu yan yana gösteren çekimler."
            ekran_yazisi: "İkinize özel, eşleşen dövmeler"
            metin: |
              Sevgililer Günü için ikinize özel, birbirini tamamlayan tasarımlar. 💞
              Fikrinizi yazın, birlikte çizelim.
            baslik: "Çift dövmesi tasarlayalım"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Çift dövmesi için bilgi almak istiyoruz."

  # ----------------------------------------------------------
  - kod: K3
    ad: "K3 | Yeniden Hedefleme | Sıcak kitle | Mesaj"
    amac: OUTCOME_ENGAGEMENT
    optimizasyon: CONVERSATIONS
    hedef_yeri: WHATSAPP
    butce_anahtari: meta_yeniden_hedefleme
    neden: >
      Seni zaten görmüş ama yazmamış kişileri geri çağırır. En ucuz randevular genelde buradan gelir.
    on_kosul: >
      Ads Manager > Kitleler'de şu özel kitleler oluşturulmalı (ID'leri aşağıya yaz):
      1) Instagram hesabıyla etkileşim kuranlar — 60 gün
      2) Videolarını %50+ izleyenler — 30 gün
      3) Web sitesi ziyaretçileri — 30 gün (Pixel kuruluysa)
      HARİÇ TUT: Mevcut müşteri listesi (telefon numaraları, KVKK onaylı)
    ozel_kitle_idleri: []         # örn. ["1202...", "1202..."]
    haric_kitle_idleri: []
    reklam_setleri:
      - kod: K3-A
        ad: "K3-A | Etkileşim 60g + Video %50 30g"
        kitle: ozel
        reklamlar:
          - kod: K3-01
            format: reels
            kreatif: "{sanatci} kısa konuşma: 'Fikrin net değilse sorun değil' + eskiz örnekleri."
            ekran_yazisi: "Fikrin henüz net değil mi?"
            metin: |
              Fikrin netleşmediyse sorun değil.
              Bir fotoğraf, bir kelime ya da bir anı yeter — gerisini birlikte çizeriz.
              Ücretsiz tasarım görüşmesi için yaz.
            baslik: "Ücretsiz tasarım görüşmesi"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Ücretsiz tasarım görüşmesi istiyorum."

          - kod: K3-02
            format: carousel
            kreatif: "Gerçek Google yorumlarının ekran görüntüleri (isimler müşteri izniyle) + ilgili dövmenin fotoğrafı."
            metin: |
              Bizi müşterilerimiz anlatsın. ⭐
              Google yorumlarımızı oku, sonra fikrini bize yaz.
            baslik: "Müşterilerimiz ne diyor?"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Yorumlarınızı gördüm, dövme yaptırmak istiyorum."
