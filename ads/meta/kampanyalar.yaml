# ============================================================
#  META KAMPANYA YAPISI v2: Erdem Melih Tattoo Studio (kurul tur 1 kararlarıyla)
#  {alan} yerleri config/studio.yaml'dan doldurulur. Kontrol: python3 tools/kontrol.py
#  faz: 1 = ilk günden · 2 = 7. GÜN TEK DÜZENLEMEDE (en kötü 2 reklam kapanır + faz 2 eklenir; öğrenme bir kez sıfırlanır)
#        sonraki eklemeler en az 7 gün arayla · bekliyor = malzeme gelince (V1 yayın kapısında)
#  kreatif_kodlari: reklamda görünen işler → kreatif/onaylar.csv'de müşteri onayı ŞART (kontrol.py --yayin)
#  Kod hazır mesajın SONUNA "(R1)" şeklinde eklenir; hızlı soruların sonuna da eklenir.
# ============================================================

ortak:
  sabit_kurallar:
    - "Kesin minimum yaş 21 (Advantage+ kitle kontrolü). 18 altı ASLA."
    - "Konum: Güvercin Sk. pini, 18 km yarıçap, 'yaşayan veya yakın zamanda bulunan'"
    - "Advantage+ KREATİF iyileştirmelerinin HEPSİ KAPALI (genişletme, rötuş, animasyon, müzik, metin). Ekran görüntüsü kurul/ klasörüne."
    - "Audience Network KAPALI"
    - "Fiyat YOK · 'en iyi / garanti / acısız' YOK · 'steril ortam' değil 'sterilize ekipman'"
    - "Ücretsiz rötuş, süre ve şart belli olana kadar metinde YOK"
    - "Reddedilen reklam aynen yeniden yüklenmez; bir kez inceleme istenir"
  guven_satiri: "Tek kullanımlık iğne · sterilize ekipman · iyileşme takibi."
  hizli_sorular:   # her reklamda; sonuna o reklamın kodu eklenir
    - "Kol/bacak projem ya da yarım kalan bir dövmem var"
    - "Portre dövme yaptırmak istiyorum"
    - "Fiyat ve seans süresini öğrenmek istiyorum"
    - "Fikrim var, ücretsiz tasarım görüşmesi istiyorum"

kampanyalar:

  - kod: A
    ad: "EM | Mesaj | WhatsApp | Realizm"
    amac: OUTCOME_ENGAGEMENT
    optimizasyon: CONVERSATIONS
    hedef_yeri: WHATSAPP
    butce_anahtari: meta_mesaj
    neden: >
      Tek kampanya, tek set: 313 TL/gün (10.000 TL/ay, %5 ücret dahil). Bütçeyi bölmek öğrenmeyi öldürür.
      Sohbet başı ≤ 44 TL olursa haftada 50 sohbetle öğrenme tamamlanır; değilse "öğrenme sınırlı" kabul edilir.
    reklam_setleri:
      - kod: A1
        ad: "A1 | Adv+ | 21+ | 18km | Dövme sinyali"
        kitle: genis
        kitle_onerileri:
          yas: "24–44"
          ozel_kitleler: ["Instagram etkileşimi 365 gün", "Video izleme %50, 30 gün (oluşunca)"]
          ilgiler_max6: ["Dövmeler (Tattoos)", "Vücut sanatı (Body art)", "Ink Master", "Inked (dergi)", "Miami Ink", "Dövme sanatçısı (varsa)"]
          not: "Kurulum günü Ads Manager'da bulunmayan ilgi alanı eklenmez. Lüks ilgileri KASITLI olarak yok (bkz. plan-v2)."
        haric: ["Instagram'dan son 30 günde mesaj gönderenler"]
        reklamlar:
          - kod: R1
            kreatif_kodlari: [F05, F03, F06, F02]
            faz: 1
            format: reels
            kreatif: "kreatif/cikti/video/R1-once-gozlere-bak.mp4 (+ Meta Ses Koleksiyonu müziği gömülü)"
            ekran_yazisi: "Önce gözlere bak. → Bu bir dövme."
            metin: |
              Önce gözlere bak: bu bir dövme. 🖤
              Tek kullanımlık iğne · sterilize ekipman · iyileşme takibi.
              Black & grey realizm, Bahçeşehir'de. Her tasarım sana özel çiziliyor; ücretsiz tasarım görüşmesiyle başlıyoruz.
              Fiyat boyuta ve detaya göre değişir; fotoğrafını gönder, ilk cevapta yaklaşık aralığı ve seans sayısını yazalım.
              📍 Bahçeşehir · {studyo_adi}
            baslik: "Realizm projeni konuşalım"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Realizm dövme projem için görüşmek istiyorum."

          - kod: C1
            kreatif_kodlari: [F05, F03, F02, F06]
            faz: 1
            format: carousel
            kreatif: "kreatif/cikti/carousel/kart01…05 (F05, F03, F02, F06, kapanış)"
            kart_basliklari: ["Bakışlar tende yaşar", "Her çizgi sana göre", "Bir kol. İki tanrı.", "Derinlik: siyah ve gri", "Sıradaki hikâye senin"]
            metin: |
              Kol, bacak, ön kol: tende hikâye anlatan black & grey realizm.
              Tek kullanımlık iğne · sterilize ekipman · iyileşme takibi.
              Tüm işler {sanatci}'ın kendi çalışması. Fikrini yaz, ücretsiz tasarım görüşmesinde birlikte netleştirelim.
              📍 Bahçeşehir · {studyo_adi}
            baslik: "Sıradaki hikâye senin"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! İşlerinizi gördüm, dövme projem için görüşmek istiyorum."

          - kod: F3
            kreatif_kodlari: [F03]
            faz: 1
            format: tekli_gorsel
            kreatif: "akis_4x5/F03.jpg + hikaye_9x16/F03.jpg"
            metin: |
              Her çizgi sana göre tasarlanır.
              Tek kullanımlık iğne · sterilize ekipman · iyileşme takibi.
              Fikrin henüz net değilse sorun değil: bir fotoğraf, bir anı ya da bir kelime yeter. Ücretsiz tasarım görüşmesinde birlikte netleştiriyoruz.
              📍 Bahçeşehir · {studyo_adi}
            baslik: "Fikrini yaz, birlikte çizelim"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Bir dövme fikrim var, tasarım görüşmesi istiyorum."

          - kod: F5
            kreatif_kodlari: [F05]
            faz: 1
            format: tekli_gorsel
            kreatif: "akis_4x5/F05.jpg + hikaye_9x16/F05.jpg"
            metin: |
              Bakışlar tende yaşar.
              Tek kullanımlık iğne · sterilize ekipman · iyileşme takibi.
              Yüzler, karakterler, büyük projeler: black & grey realizm. Yarım kalmış bir kol ya da bacak projen varsa onu da birlikte planlıyoruz.
              📍 Bahçeşehir · {studyo_adi}
            baslik: "Kol ya da bacak projeni planlayalım"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Kol/bacak projem için görüşmek istiyorum."

          - kod: V1
            kreatif_kodlari: [V1]
            faz: bekliyor
            format: reels
            kreatif: "Erdem Melih konuşma videosu (docs/12 → Video A). ÇEKİLİNCE kurgulanacak. YAYIN ÖN ŞARTI."
            ekran_yazisi: "DÖVMENİ YAPMADAN ÖNCE TANIŞALIM"
            metin: |
              Dövmeni yapmadan önce tanışalım.
              Tek kullanımlık iğne · sterilize ekipman · iyileşme takibi.
              Ben {sanatci}. Black & grey realizm çalışıyorum; her tasarımı sana özel çiziyorum. Ücretsiz tasarım görüşmesi için yaz.
              📍 Bahçeşehir
            baslik: "Erdem Melih ile tanış"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba Erdem! Dövme projem için görüşmek istiyorum."

          # ---- FAZ 2 (6. günden itibaren, ret yoksa) ayrı tekli reklamlar ----
          - kod: R2
            kreatif_kodlari: [R2-SUREC, F04]
            faz: 2
            kosul: "SADECE R3 (black & grey süreç) aynı düzenlemede yayına giriyorsa. R2+F4 3 gün üst üste set harcamasının %40'ını aşarsa ya da renkli kodlu sohbetler %30'u geçerse ikisi birden durdurulur."
            format: reels
            kreatif: "kreatif/cikti/video/R2-surecten-sonuca-renkli.mp4"
            ekran_yazisi: "Bu baldır böyle yapıldı. → Sonuç. Renkte de aynı ustalık."
            metin: |
              Bu baldır böyle yapıldı. 🔥
              Tek kullanımlık iğne · sterilize ekipman · iyileşme takibi.
              Black & grey'de olduğu gibi renkte de: sana özel tasarım, ücretsiz tasarım görüşmesi.
              📍 Bahçeşehir · {studyo_adi}
            baslik: "Fikrini yaz, birlikte çizelim"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Renkli realizm dövme için görüşmek istiyorum."

          - kod: F1
            kreatif_kodlari: [F01]
            faz: 2
            format: tekli_gorsel
            kreatif: "akis_4x5/F01.jpg + hikaye_9x16/F01.jpg"
            metin: |
              Yarısı kurukafa, yarısı palyaço.
              Tek kullanımlık iğne · sterilize ekipman · iyileşme takibi.
              Karanlık temalar, karakter realizmi: fikrini yaz, kompozisyonu birlikte kuralım.
              📍 Bahçeşehir · {studyo_adi}
            baslik: "Karakter realizmi için yaz"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Karakter/karanlık tema bir dövme için görüşmek istiyorum."

          - kod: F4
            kreatif_kodlari: [F04]
            faz: 2
            kosul: "SADECE R3 (black & grey süreç) aynı düzenlemede yayına giriyorsa. R2+F4 3 gün üst üste set harcamasının %40'ını aşarsa ya da renkli kodlu sohbetler %30'u geçerse ikisi birden durdurulur."
            format: tekli_gorsel
            kreatif: "akis_4x5/F04.jpg + hikaye_9x16/F04.jpg"
            metin: |
              Renkte de aynı ustalık.
              Tek kullanımlık iğne · sterilize ekipman · iyileşme takibi.
              Renkli realizm projeleri için fikrini yaz, ücretsiz tasarım görüşmesiyle başlayalım.
              📍 Bahçeşehir · {studyo_adi}
            baslik: "Renkli realizm projeni konuşalım"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Renkli realizm projem için görüşmek istiyorum."

  - kod: B
    ad: "EM | Yeniden Hedefleme | WhatsApp (FAZ 2)"
    faz: 2
    amac: OUTCOME_ENGAGEMENT
    optimizasyon: CONVERSATIONS
    hedef_yeri: WHATSAPP
    butce_anahtari: meta_yeniden_hedefleme
    neden: "Faz 2 geçiş kriterleri sağlanınca ve günlük bütçe ≥ 450 TL olunca. Kitle < 3.000 kişiyse açılmaz."
    ozel_kitle_idleri: []
    reklam_setleri:
      - kod: B1
        ad: "B1 | Sıcak | IG etkileşim 365g + video %50 30g | 18km"
        kitle: ozel
        reklamlar:
          - kod: B1V
            kreatif_kodlari: [V1]
            faz: 2
            format: reels
            kreatif: "V1 konuşma videosu veya iyileşmiş yan yana görsel"
            metin: |
              Fikrin henüz net değil mi?
              Tek kullanımlık iğne · sterilize ekipman · iyileşme takibi.
              Bir fotoğraf ya da bir anı yeter; gerisini ücretsiz tasarım görüşmesinde birlikte netleştiririz.
              📍 Bahçeşehir
            baslik: "Ücretsiz tasarım görüşmesi"
            cta: WHATSAPP_MESSAGE
            karsilama: "Merhaba! Ücretsiz tasarım görüşmesi istiyorum."
