  faz: 2
  butce_anahtari: google_arama
  ag: "Yalnızca Arama Ağı (Görüntülü Reklam Ağı KAPALI, Arama ortakları KAPALI)"
  teklif: "İlk 2 hafta: Tıklamaları en üst düzeye çıkar (TBM sınırı 15 TL). 15+ dönüşümden sonra: Dönüşümleri en üst düzeye çıkar."
  konum: "Stüdyo çevresinde 18 km, 'Varlık' seçeneği"
  dil: "Türkçe"
  zaman: "11:00–21:00"
  donusumler: ["Landing'de WhatsApp tıklaması", "Arama öğesi araması (30 sn+)", "Yol tarifi (İşletme Profili)"]
  ogeler:
    site_baglantilari:
      - ["İşler", "Black & grey realizm portfolyosu", "#portfolyo"]
      - ["Nasıl Çalışıyoruz", "Fikirden randevuya", "#surec"]
      - ["Sık Sorulanlar", "Seans, bakım, randevu", "#sss"]
      - ["Konum", "Bahçeşehir'deki stüdyo", "#konum"]
    aciklama_metinleri: ["Ücretsiz tasarım görüşmesi", "Tek kullanımlık iğne", "Sterilize ekipman", "İyileşme takibi"]
    yapilandirilmis_snippet: { baslik: "Stiller", degerler: ["Black & Grey", "Realizm", "Portre", "Renkli realizm", "Blackwork", "Kapatma"] }
    arama_ogesi: "{telefon_whatsapp}"
    konum_ogesi: "Google İşletme Profilini bağla"

