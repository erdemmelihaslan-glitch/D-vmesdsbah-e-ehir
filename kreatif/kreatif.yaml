# ============================================================
#  KREATİF ÜRETİM AYARLARI v2 (kurul tur 1 kararlarıyla)
#  python3 tools/kreatif_uret.py [--sadece foto|video] [--cozunurluk 4k] [--muzik parca.mp3]
#  Editler: kadraj, global gamma, arka plan temizliği, format, yazı.
#  DÖVMENİN KENDİSİ RÖTUŞLANMAZ. Yapay zekâ ile büyütme YOK (detay uydurur → yanıltıcı).
# ============================================================

marka:
  ust: "ERDEM MELİH"
  alt: "TATTOO STUDIO"
  uzmanlik: "Black & Grey Realizm"
  konum: "Bahçeşehir · İstanbul"
  hesap: "@erdemmelih.ink"
  teklif: "Ücretsiz tasarım görüşmesi"
  cta: "Fikrini WhatsApp'tan yaz"

isleme:
  gamma: 1.2            # orta tonları açar; siyah ve beyaz nokta sabit kalır
  zemin_parlaklik: 0.30
  max_buyutme: 1.5      # kaynaktan en fazla 1,5x büyütme (yumuşamayı önler)
  dovme_orani: 0.60     # kadrajda dövmenin kaplayacağı genişlik oranı

# odak: dövmenin merkezi (kaynak piksel) · dovme_gen: dövmenin genişliği (kaynak piksel)
# faz: 1 = ilk günden · 2 = 6. günden itibaren, ayrı tekli reklam · organik = reklamda yok
fotograflar:
  - {dosya: 01-kurukafa-palyaco.jpg, kod: F01, faz: 2, odak: [505, 760], dovme_gen: 650,
     temizle: [[55, 250, 122, 472]]}
  - {dosya: 02-anubis-zeus-kol.jpg, kod: F02, faz: 1, odak: [480, 540], dovme_gen: 330}
  - {dosya: 03-palyaco-kadin-onkol.jpg, kod: F03, faz: 1, odak: [480, 470], dovme_gen: 400}
  - {dosya: 04-alev-kurukafa-renkli-baldir.jpg, kod: F04, faz: 2, odak: [725, 700], dovme_gen: 510}
  - {dosya: 05-yasli-adam-girdap-bacak.jpg, kod: F05, faz: 1, odak: [850, 800], dovme_gen: 590, goz: [855, 690]}
  - {dosya: 06-kopekbaligi-ahtapot-kol.jpg, kod: F06, faz: 1, odak: [1160, 1200], dovme_gen: 990}
  - {dosya: 07-cadi-bacak.jpg, kod: F07, faz: organik, kirp: [470, 700, 1430, 1900], odak: [480, 600], dovme_gen: 800}

# Hikâye / Reels (9:16) görsel üst yazısı
hikaye_yazilari:
  F01: "Yarısı kurukafa, yarısı palyaço."
  F02: "Bir kol. İki tanrı."
  F03: "Her çizgi sana göre."
  F04: "Renkte de aynı ustalık."
  F05: "Bakışlar tende yaşar."
  F06: "Derinlik: siyah ve gri."
  F07: "Bacaktan bir hikâye."

carousel:
  sira: [F05, F03, F02, F06]
  kapanis_baslik: "Sıradaki hikâye senin."
  kapanis_alt: "Fikrini yaz, tasarımı birlikte netleştirelim."

videolar:
  R1:
    cikti: R1-once-gozlere-bak.mp4
    kanca: "Önce gözlere bak."
    kanca2: "Bu bir dövme."
    kanca2_alt: "Black & Grey Realizm"
    acilis: F05            # 0–0,6 sn 1,8x sabit (gözler) → 0,6–1,2 sn geri çekil → 1,2–2,4 sn "Bu bir dövme."
    kesmeler: [F03, F06, F02]
    bpm: 100               # müzik BPM'i; kesme = 2 vuruş (120/BPM sn), açılış = 4 vuruş, kapanış = 3 vuruş
    # 100 BPM → açılış 2,4 sn · kesmeler 2,4 / 3,6 / 4,8 sn · kapanış 6,0 sn'de başlar, 1,8 sn · toplam 7,8 sn
  R2:
    cikti: R2-surecten-sonuca-renkli.mp4
    kaynak: v1-surec-alev-baldir.mov
    kanca: "Bu baldır böyle yapıldı."
    sonuc_foto: F04
    sonuc_yazi: "Sonuç."
    sonuc_alt: "Renkte de aynı ustalık."
    sonuc_suresi: 2.5
    kapanis_suresi: 1.5
  organik_mario:
    cikti: ORGANIK-mario-surec.mp4
    kaynak: v2-surec-mario-onkol.mov
